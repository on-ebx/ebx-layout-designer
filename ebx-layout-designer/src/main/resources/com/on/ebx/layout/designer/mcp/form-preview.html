<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form preview</title>
<!--
  ON EBX Layout Designer: the record form preview, an MCP App (extension io.modelcontextprotocol/ui, spec 2026-01-26).
  Rendered by the host in a sandboxed iframe and fed by ui/notifications/tool-result of layout_get, layout_starter or
  layout_validate (for the last one, the layout is the tool's input). The table's labels and types come from
  layout_describe_table, called through the host (tools/call) under the caller's session. The page holds no EBX session,
  writes nothing and loads nothing from outside: a mock-up of the form, not the form; the designer is one link away.
-->
<style>
:root {
  --on-primary: #7F17FF;
  --on-secondary: #3931EC;
  --on-accent: #5FFFB7;
  --on-dark: #07073C;
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f4f3fb);
  --fg: var(--color-text-primary, #07073C);
  --fg2: var(--color-text-secondary, #5b5a7a);
  --line: var(--color-border-primary, #d9d7ea);
  --font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  --card: #ffffff;
  --field: #fbfbfe;
  --ro: #f0eff7;
  --err: #c62828;
  --warn: #b26a00;
  --ok: #0f9d6b;
  --sel: #f3ebff;
  --shadow: 0 1px 2px rgba(7, 7, 60, 0.10);
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #121226);
  --bg2: var(--color-background-secondary, #1c1c38);
  --fg: var(--color-text-primary, #f2f1ff);
  --fg2: var(--color-text-secondary, #b4b2d6);
  --line: var(--color-border-primary, #37365e);
  --card: #1a1a34;
  --field: #22223f;
  --ro: #2a2a48;
  --err: #ff8a80;
  --warn: #ffb74d;
  --ok: #5FFFB7;
  --sel: #2a1a4f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.4; }
#app { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
header h1 .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--on-primary); display: inline-block; }
header .sub { color: var(--fg2); font-size: 12px; }
header .grow { flex: 1; }
button, select { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); cursor: pointer; }
button.primary { background: var(--on-primary); border-color: var(--on-primary); color: #fff; }
.findings { margin: 10px 14px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 8px 10px; font-size: 12px; }
.findings .ok { color: var(--ok); font-weight: 600; }
.findings li { margin: 2px 0; list-style: none; }
.findings ul { margin: 4px 0 0; padding: 0; }
.sev { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; border-radius: 4px; padding: 0 5px; margin-right: 6px; color: #fff; }
.sev.sev-e { background: var(--err); } .sev.sev-w { background: var(--warn); }
:root[data-theme="dark"] .sev { color: #07073C; }
.where { color: var(--fg2); }
nav.tabs { display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 12px; white-space: nowrap; color: var(--fg2); }
nav.tabs button.on { color: var(--fg); border-bottom-color: var(--on-primary); font-weight: 600; }
nav.tabs button .n { font-size: 10px; color: var(--fg2); margin-left: 4px; }
nav.tabs button.bad { color: var(--err); }
main { display: flex; align-items: flex-start; }
#form { flex: 1; min-width: 0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: flex-start; }
.row > .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row .sect { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); margin: 4px 0 -4px; }
.block { background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; position: relative; }
.block:hover { border-color: var(--on-secondary); }
.block.sel { outline: 2px solid var(--on-primary); outline-offset: -1px; }
.block.has-e { border-color: var(--err); } .block.has-w { border-color: var(--warn); }
.block > .bh { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.block > .bh .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 10px; font-family: var(--mono); color: var(--fg2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.chip { font-size: 10px; border-radius: 10px; padding: 0 7px; background: var(--bg2); color: var(--fg2); border: 1px dashed var(--line); white-space: nowrap; }
.block > .bb { padding: 8px 10px 10px; }
.block .note { font-size: 11px; color: var(--fg2); margin: 0 0 6px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.fld { min-width: 0; border-radius: 6px; padding: 2px; }
.fld.wide { grid-column: 1 / -1; }
.fld:hover { background: var(--bg2); }
.fld.sel { background: var(--sel); }
.fld.bad .lb { color: var(--err); }
.fld .lb { font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fld .lb .req { color: var(--on-primary); font-weight: 700; margin-left: 2px; }
.w { height: 24px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); display: flex; align-items: center; padding: 0 7px; font-size: 11px; color: var(--fg2); gap: 6px; overflow: hidden; white-space: nowrap; }
.w.ro { background: var(--ro); border-style: dashed; }
.w.area { height: 46px; align-items: flex-start; padding-top: 4px; }
.w .ic { margin-left: auto; opacity: .7; }
.w.chk { border: none; background: none; padding: 0; }
.w.chk i { width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); display: inline-block; }
.ph { display: block; height: 7px; border-radius: 4px; background: var(--line); opacity: .7; }
.hero { display: flex; gap: 12px; align-items: center; }
.hero .logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--on-primary), var(--on-secondary)); flex: none; }
.hero .nm { font-size: 17px; font-weight: 700; }
.hero .sb { color: var(--fg2); font-size: 12px; }
.hero .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.hero .chips span { font-size: 10px; border-radius: 10px; padding: 1px 7px; background: var(--bg2); border: 1px solid var(--line); }
.meter { width: 120px; flex: none; text-align: right; font-size: 10px; color: var(--fg2); }
.meter .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 72%; background: var(--on-accent); }
.facts { display: flex; gap: 8px; flex-wrap: wrap; }
.facts div { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--field); }
.facts b { display: block; font-size: 15px; color: var(--on-secondary); }
:root[data-theme="dark"] .facts b { color: #8c87ff; }
.facts span { font-size: 10px; color: var(--fg2); }
table.grid { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
table.grid th { text-align: left; color: var(--fg2); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.grid td { padding: 6px; border-bottom: 1px solid var(--line); }
.vlist div { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 11px; color: var(--fg2); }
.vlist i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.refs { font-family: var(--mono); font-size: 11px; color: var(--fg2); word-break: break-all; }
.refs span { display: inline-block; margin: 0 6px 2px 0; }
.mark { position: absolute; top: -7px; left: 10px; font-size: 10px; font-weight: 700; color: #fff; background: var(--err); border-radius: 8px; padding: 0 6px; }
.mark.mark-w { background: var(--warn); }
aside { width: 300px; flex: none; border-left: 1px solid var(--line); padding: 12px 14px; background: var(--bg2); display: none; align-self: flex-start; position: sticky; top: 0; overflow: auto; max-height: 100vh; box-sizing: border-box; border-bottom: 1px solid var(--line); border-radius: 0 0 0 8px; }
aside.on { display: block; }
aside h2 { font-size: 13px; margin: 0 0 2px; display: flex; gap: 6px; align-items: center; }
aside h2 span { flex: 1; }
aside .meta { color: var(--fg2); font-size: 11px; margin-bottom: 8px; word-break: break-all; }
aside dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; font-size: 12px; margin: 0 0 10px; }
aside dt { color: var(--fg2); } aside dd { margin: 0; word-break: break-word; }
aside pre { font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
aside .close { padding: 2px 8px; }
.msg { padding: 24px 14px; color: var(--fg2); }
.msg.err { color: var(--err); }
.foot { font-size: 11px; color: var(--fg2); padding: 0 14px 10px; }
@media (max-width: 640px) {
  .row { flex-direction: column; } .row > .col { width: 100% !important; }
  .fields { grid-template-columns: 1fr; }
  main { flex-direction: column; } aside { width: auto; border-left: none; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot"></span><span id="title">Form preview</span></h1>
    <span class="sub" id="sub"></span>
    <span class="grow"></span>
    <select id="locale" title="Locale" style="display:none"></select>
    <button class="primary" id="open" style="display:none"></button>
  </header>
  <div id="findings" class="findings" style="display:none"></div>
  <nav class="tabs" id="tabs" style="display:none"></nav>
  <main>
    <div id="form"><div class="msg" id="msg"></div></div>
    <aside id="side"></aside>
  </main>
  <div class="foot" id="foot"></div>
</div>
<script>
(function () {
  'use strict';
  // ---------------------------------------------------------------- texts (host language unknown: the browser's)
  var FR = /^fr/i.test(navigator.language || '');
  var T = FR ? {
    title: 'Aperçu du formulaire', waiting: 'En attente de la mise en page…', notFound: 'Aucune mise en page enregistrée pour cette table : demandez layout_starter pour partir de la mise en page de départ.',
    noLayout: 'Ce résultat ne contient pas de mise en page.', open: 'Ouvrir dans le designer', version: 'version', inactive: 'inactive', by: 'par',
    starter: 'mise en page de départ, non enregistrée', check: 'vérification', valid: 'Aucune erreur : la mise en page peut être enregistrée.',
    errors: 'erreur(s)', warnings: 'avertissement(s)', unplaced: 'non rattaché(s) à un bloc', close: 'Fermer', block: 'Bloc', field: 'Champ',
    path: 'Chemin', label: 'Libellé', type: 'Type', group: 'Groupe', required: 'Obligatoire', yes: 'oui', no: 'non', readOnly: 'Lecture seule',
    widget: 'Widget', values: 'Valeurs', target: 'Cible', unknown: 'absent du modèle', json: 'JSON du bloc', table: 'Table', fieldsOf: 'Champs',
    mock: 'Maquette : les valeurs ne sont pas lues ; le formulaire réel est dans ON EBX.', labels: 'Lecture des libellés…', noLabels: 'Libellés indisponibles',
    rows: 'lignes', items: 'éléments', toReview: 'À traiter', empty: 'vide', refs: 'Éléments référencés'
  } : {
    title: 'Form preview', waiting: 'Waiting for the layout…', notFound: 'No layout stored for this table: ask for layout_starter to begin from the starting layout.',
    noLayout: 'This result holds no layout.', open: 'Open in the designer', version: 'version', inactive: 'inactive', by: 'by',
    starter: 'starting layout, not saved', check: 'check', valid: 'No error: the layout can be saved.',
    errors: 'error(s)', warnings: 'warning(s)', unplaced: 'not tied to a block', close: 'Close', block: 'Block', field: 'Field',
    path: 'Path', label: 'Label', type: 'Type', group: 'Group', required: 'Required', yes: 'yes', no: 'no', readOnly: 'Read only',
    widget: 'Widget', values: 'Values', target: 'Target', unknown: 'not in the model', json: 'Block JSON', table: 'Table', fieldsOf: 'Fields',
    mock: 'Mock-up: no value is read; the actual form is in ON EBX.', labels: 'Reading the labels…', noLabels: 'Labels unavailable',
    rows: 'rows', items: 'items', toReview: 'To review', empty: 'empty', refs: 'Referenced elements'
  };
  document.getElementById('title').textContent = T.title;
  document.getElementById('msg').textContent = T.waiting;
  document.getElementById('open').textContent = T.open;

  // ---------------------------------------------------------------- the host bridge: JSON-RPC 2.0 over postMessage
  var nextId = 1, pending = {};
  function post(message) { window.parent.postMessage(message, '*'); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      post({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method: method, params: params || {} }); }
  window.addEventListener('message', function (event) {
    var m = event.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && m.method === undefined) {
      var p = pending[m.id]; if (!p) return; delete pending[m.id];
      if (m.error) p.reject(new Error(m.error.message || JSON.stringify(m.error))); else p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-input') { onToolInput(m.params || {}); return; }
    if (m.method === 'ui/notifications/tool-result') { onToolResult(m.params || {}); return; }
    if (m.method === 'ui/notifications/tool-cancelled') { showMessage((m.params && m.params.reason) || 'cancelled', true); return; }
    if (m.method === 'ui/notifications/host-context-changed') { applyHostContext(m.params || {}); return; }
    if (m.method === 'ui/resource-teardown' || m.method === 'ping') { post({ jsonrpc: '2.0', id: m.id, result: {} }); return; }
  });
  function applyHostContext(ctx) {
    var root = document.documentElement;
    if (ctx.theme) root.setAttribute('data-theme', ctx.theme);
    var vars = ctx.styles && ctx.styles.variables;
    if (vars) Object.keys(vars).forEach(function (k) { if (vars[k] !== undefined && /^--[a-z0-9-]+$/i.test(k)) root.style.setProperty(k, vars[k]); });
  }
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'ON EBX form preview', version: '0.1.0' },
    appCapabilities: { availableDisplayModes: ['inline'] }
  }).then(function (result) {
    if (result && result.hostContext) applyHostContext(result.hostContext);
    notify('ui/notifications/initialized', {});
  }, function () { notify('ui/notifications/initialized', {}); });
  var lastW = 0, lastH = 0;
  function reportSize() {
    var app = document.getElementById('app'), h = app.offsetHeight, w = app.offsetWidth;
    if (h !== lastH || w !== lastW) { lastH = h; lastW = w; notify('ui/notifications/size-changed', { width: w, height: h }); }
  }
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(document.getElementById('app'));

  // ---------------------------------------------------------------- state
  var input = {}, head = null, layout = null, report = null, model = null, locale = null, tab = 0, selected = null;
  var fieldIndex = {}, assocIndex = {}, findingsByBlock = {}, findingsByField = {}, findingsByTab = {}, unplaced = [];

  function parseMaybe(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } } return v; }
  function structured(result) {
    var sc = result && result.structuredContent;
    if (!sc && result && result.content) {
      for (var i = 0; i < result.content.length; i++) if (result.content[i].type === 'text') { try { sc = JSON.parse(result.content[i].text); break; } catch (e) { /* markdown text */ } }
    }
    return sc || null;
  }
  function onToolInput(params) {
    input = params.arguments || {};
    if (!layout && input.layout) { layout = parseMaybe(input.layout); }
  }
  function onToolResult(result) {
    var sc = structured(result);
    if (result.isError || !sc) { showMessage((sc && sc.error) || textOf(result) || T.noLayout, true); return; }
    if (sc.error) { showMessage(sc.error, true); return; }
    head = sc;
    if (sc.layout) layout = parseMaybe(sc.layout);
    else if (sc.valid !== undefined) { report = sc; layout = layout || parseMaybe(input.layout); }
    if (sc.found === false) { renderHead(); showMessage(T.notFound, false); return; }
    if (!layout || !Array.isArray(layout.tabs)) { renderHead(); showMessage(T.noLayout, true); return; }
    pickLocale(); placeFindings(); renderAll(); loadModel();
  }
  function textOf(result) { var c = result && result.content; return c && c[0] && c[0].text ? String(c[0].text).slice(0, 400) : ''; }
  function showMessage(text, isError) {
    var form = document.getElementById('form');
    form.innerHTML = '<div class="msg' + (isError ? ' err' : '') + '">' + esc(text) + '</div>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // the table as the designer sees it: labels, types, groups, associations (one call, through the host)
  function loadModel() {
    if (model || !head || !head.table) return;
    document.getElementById('foot').textContent = T.labels;
    request('tools/call', { name: 'layout_describe_table', arguments: { dataspace: head.dataspace, dataset: head.dataset, table: head.table } })
      .then(function (result) {
        var sc = structured(result);
        if (!sc || sc.error) throw new Error((sc && sc.error) || T.noLabels);
        model = sc; fieldIndex = {}; assocIndex = {};
        (sc.fields || []).forEach(function (f) { fieldIndex[f.path] = f; });
        (sc.groups || []).forEach(function (g) { if (!fieldIndex[g.path]) fieldIndex[g.path] = { path: g.path, label: g.label, type: 'group' }; });
        (sc.associations || []).forEach(function (a) { assocIndex[a.path] = a; });
        renderAll();
      })
      .catch(function (e) { document.getElementById('foot').textContent = T.noLabels + ' (' + e.message + '). ' + T.mock; });
  }

  // ---------------------------------------------------------------- locales
  function pickLocale() {
    var locs = (layout.locales && layout.locales.length) ? layout.locales : [];
    var want = (navigator.language || '').toLowerCase();
    locale = locs.filter(function (l) { return l.toLowerCase() === want; })[0]
      || locs.filter(function (l) { return l.slice(0, 2).toLowerCase() === want.slice(0, 2); })[0] || locs[0] || null;
    var sel = document.getElementById('locale');
    if (locs.length > 1) {
      sel.innerHTML = locs.map(function (l) { return '<option' + (l === locale ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
      sel.style.display = '';
      sel.onchange = function () { locale = sel.value; renderAll(); };
    }
  }
  function loc(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') {
      if (locale && v[locale]) return v[locale];
      var keys = Object.keys(v); return keys.length ? v[keys[0]] : '';
    }
    return String(v);
  }
  function last(path) { var s = String(path || '').split('/'); return s[s.length - 1] || path; }
  function fieldLabel(path) { var f = fieldIndex[path]; return f && f.label ? f.label : last(path); }

  // ---------------------------------------------------------------- findings: tied to the block, field or tab they name
  function placeFindings() {
    findingsByBlock = {}; findingsByField = {}; findingsByTab = {}; unplaced = [];
    if (!report) return;
    function add(map, key, f) { (map[key] = map[key] || []).push(f); }
    var all = (report.errors || []).map(function (f) { return { e: true, where: f.where || '', text: f.text || '' }; })
      .concat((report.warnings || []).map(function (f) { return { e: false, where: f.where || '', text: f.text || '' }; }));
    all.forEach(function (f) {
      var placed = false;
      var tabName = (/Tab\s+“([^”]+)”/i.exec(f.where) || /Onglet\s+«\s*([^»]+?)\s*»/i.exec(f.where) || [])[1];
      var blockName = (/block\s+“([^”]+)”/i.exec(f.where) || /bloc\s+«\s*([^»]+?)\s*»/i.exec(f.where) || /block\s+([A-Za-z0-9_-]+)/i.exec(f.where) || [])[1];
      var paths = (f.text.match(/\/[A-Za-z_][\w./-]*/g) || []);
      layout.tabs.forEach(function (t, ti) {
        var tabMatch = tabName && Object.keys(typeof t.label === 'object' && t.label ? t.label : {}).some(function (k) { return t.label[k] === tabName; }) || tabName === t.label || tabName === t.id;
        if (tabName && !tabMatch) return;
        eachBlock(t, function (b, key) {
          var hit = blockName && (b.id === blockName || (b.type === blockName && (!b.id || tabMatch)));
          var fieldHit = paths.filter(function (p) { return refs(b).indexOf(p) >= 0; });
          if (hit || (fieldHit.length && (tabMatch || !tabName))) {
            add(findingsByBlock, key, f); placed = true;
            fieldHit.forEach(function (p) { add(findingsByField, key + '|' + p, f); });
          }
        });
        if (tabMatch && !placed) { add(findingsByTab, ti, f); placed = true; }
      });
      if (!placed) unplaced.push(f);
    });
  }
  function eachBlock(t, fn) {
    (t.rows || []).forEach(function (r, ri) {
      (r.blocks || []).forEach(function (col, ci) { (col || []).forEach(function (b, bi) { fn(b, (t.id || '') + ':' + ri + ':' + ci + ':' + bi, r); }); });
    });
  }
  // every model path a block refers to
  function refs(b) {
    var out = [];
    (function walk(v, k) {
      if (typeof v === 'string') { if (v.charAt(0) === '/' && k !== 'url') out.push(v); }
      else if (Array.isArray(v)) v.forEach(function (x) { walk(x, k); });
      else if (v && typeof v === 'object') Object.keys(v).forEach(function (kk) { if (kk !== 'title' && kk !== 'note' && kk !== 'label') walk(v[kk], kk); });
    })(b, '');
    return out;
  }

  // ---------------------------------------------------------------- rendering
  function renderAll() { renderHead(); renderFindings(); renderTabs(); renderTab(); renderSide(); }
  function renderHead() {
    if (!head) return;
    var title = T.title + ' · ' + (head.tableLabel || last(head.table));
    document.getElementById('title').textContent = title;
    var bits = [head.dataspace, head.dataset].filter(Boolean).join(' / ');
    if (head.version) bits += ' · ' + T.version + ' ' + head.version + (head.active === false ? ' (' + T.inactive + ')' : '');
    if (head.updatedBy) bits += ' · ' + T.by + ' ' + head.updatedBy + (head.updatedOn ? ', ' + String(head.updatedOn).replace('T', ' ').slice(0, 16) : '');
    if (head.found === undefined && head.layout && head.note !== undefined) bits += ' · ' + T.starter;
    if (report) bits += ' · ' + T.check;
    document.getElementById('sub').textContent = bits;
    var link = head.designerLink || '';
    var btn = document.getElementById('open');
    btn.style.display = link ? '' : 'none';
    btn.onclick = function () { openLink(link); };
    document.getElementById('foot').textContent = model ? T.mock : document.getElementById('foot').textContent || T.mock;
  }
  function openLink(url) {
    if (!url) return;
    request('ui/open-link', { url: url }).catch(function () { try { window.open(url, '_blank', 'noopener'); } catch (e) { /* sandboxed */ } });
  }
  function renderFindings() {
    var box = document.getElementById('findings');
    if (!report) { box.style.display = 'none'; return; }
    box.style.display = '';
    var ne = (report.errors || []).length, nw = (report.warnings || []).length;
    var html = (ne === 0) ? '<div class="ok">' + esc(T.valid) + '</div>' : '';
    html += '<div>' + ne + ' ' + esc(T.errors) + ', ' + nw + ' ' + esc(T.warnings) + (unplaced.length ? ' · ' + unplaced.length + ' ' + esc(T.unplaced) : '') + '</div><ul>';
    (report.errors || []).forEach(function (f) { html += '<li><span class="sev sev-e">ERR</span><span class="where">' + esc(f.where) + '</span> · ' + esc(f.text) + '</li>'; });
    (report.warnings || []).forEach(function (f) { html += '<li><span class="sev sev-w">WARN</span><span class="where">' + esc(f.where) + '</span> · ' + esc(f.text) + '</li>'; });
    box.innerHTML = html + '</ul>';
  }
  function tabHasError(t, ti) {
    var bad = (findingsByTab[ti] || []).some(function (f) { return f.e; });
    eachBlock(t, function (b, key) { if ((findingsByBlock[key] || []).some(function (f) { return f.e; })) bad = true; });
    return bad;
  }
  function renderTabs() {
    var nav = document.getElementById('tabs');
    if (!layout) return;
    if (tab >= layout.tabs.length) tab = 0;
    nav.style.display = '';
    nav.innerHTML = layout.tabs.map(function (t, i) {
      var n = (t.count || []).length ? '<span class="n">(' + (t.count || []).map(function (a) { return esc(assocLabel(a)); }).join(', ') + ')</span>' : '';
      return '<button data-tab="' + i + '" class="' + (i === tab ? 'on' : '') + (tabHasError(t, i) ? ' bad' : '') + '">' + esc(loc(t.label) || t.id || ('#' + (i + 1))) + n + '</button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      b.onclick = function () { tab = +b.getAttribute('data-tab'); selected = null; renderTabs(); renderTab(); renderSide(); };
    });
  }
  function assocLabel(path) { var a = assocIndex[path]; return a && a.label ? a.label : last(path); }
  var blockByKey = {};
  function renderTab() {
    var form = document.getElementById('form');
    if (!layout) return;
    var t = layout.tabs[tab]; blockByKey = {};
    var html = '';
    (findingsByTab[tab] || []).forEach(function (f) { html += '<div class="findings"><span class="sev ' + (f.e ? 'sev-e' : 'sev-w') + '">' + (f.e ? 'ERR' : 'WARN') + '</span>' + esc(f.text) + '</div>'; });
    (t.rows || []).forEach(function (r, ri) {
      if (r.section) html += '<div class="row"><div class="sect">' + esc(loc(r.section)) + '</div></div>';
      var cols = r.blocks || [];
      var n = Math.max(1, Math.min(2, r.columns || cols.length || 1));
      var ratio = String(r.ratio || '11').split('').map(Number).filter(function (x) { return x > 0; });
      if (ratio.length < 2) ratio = [1, 1];
      html += '<div class="row">';
      for (var ci = 0; ci < n; ci++) {
        var flex = n === 1 ? 1 : ratio[ci];
        html += '<div class="col" style="flex:' + flex + ' 1 0;width:0">';
        (cols[ci] || []).forEach(function (b, bi) {
          var key = (t.id || '') + ':' + ri + ':' + ci + ':' + bi;
          blockByKey[key] = b; html += renderBlock(b, key);
        });
        html += '</div>';
      }
      html += '</div>';
    });
    form.innerHTML = html || '<div class="msg">' + esc(T.empty) + '</div>';
    Array.prototype.forEach.call(form.querySelectorAll('.block'), function (el) {
      el.onclick = function (ev) {
        var f = ev.target.closest('.fld');
        selected = f ? { key: el.getAttribute('data-key'), field: f.getAttribute('data-p') } : { key: el.getAttribute('data-key') };
        Array.prototype.forEach.call(form.querySelectorAll('.sel'), function (s) { s.classList.remove('sel'); });
        (f || el).classList.add('sel');
        renderSide();
      };
    });
    if (selected) {
      var el = form.querySelector('.block[data-key="' + selected.key + '"]');
      if (el) { var target = selected.field ? el.querySelector('.fld[data-p="' + cssq(selected.field) + '"]') : el; (target || el).classList.add('sel'); }
    }
  }
  function cssq(s) { return String(s).replace(/["\\]/g, '\\$&'); }
  function chips(b) {
    var c = '';
    if (b.cond) c += '<span class="chip" title="' + esc(b.cond) + '">cond</span>';
    if (b.showIf) c += '<span class="chip" title="' + esc(JSON.stringify(b.showIf)) + '">showIf</span>';
    if (b.roles) c += '<span class="chip" title="' + esc([].concat(b.roles).join(', ')) + '">' + esc([].concat(b.roles).join(', ')) + '</span>';
    return c;
  }
  function renderBlock(b, key) {
    var fs = findingsByBlock[key] || [], ne = fs.filter(function (f) { return f.e; }).length, nw = fs.length - ne;
    var title = loc(b.title) || (b.type === 'grid' && b.a ? assocLabel(b.a) : '') || (b.type === 'facts' ? '' : '');
    var cls = 'block' + (ne ? ' has-e' : nw ? ' has-w' : '');
    var h = '<div class="' + cls + '" data-key="' + esc(key) + '">';
    if (ne || nw) h += '<span class="mark' + (ne ? '' : ' mark-w') + '">' + (ne ? ne + ' ERR' : nw + ' WARN') + '</span>';
    if (b.type !== 'hero') h += '<div class="bh"><span class="t">' + esc(title || ' ') + '</span>' + chips(b) + '<span class="badge">' + esc(b.type || '?') + '</span></div>';
    h += '<div class="bb">';
    if (b.note) h += '<p class="note">' + esc(loc(b.note)) + '</p>';
    var draw = DRAW[b.type] || drawGeneric;
    h += draw(b, key);
    return h + '</div></div>';
  }
  function widget(f, p) {
    var m = fieldIndex[p] || {}, type = m.type || '', w = f.w || '';
    var ro = f.ro ? ' ro' : '';
    if (w === 'area' || type === 'text') return '<div class="w area' + ro + '"><span class="ph" style="width:70%"></span></div>';
    if (type === 'boolean' || w === 'switch' || w === 'check') return '<div class="w chk"><i></i></div>';
    var icon = '';
    if (m.values || m.enumeration || m.fk || m.foreignKey || m.target || w === 'select') icon = '▾';
    else if (/date|time/i.test(type)) icon = '📅';
    else if (type === 'media' || w === 'image') icon = '🖼';
    else if (/int|decimal|number|float/i.test(type)) icon = '#';
    else if (w === 'copyId') icon = '⧉';
    return '<div class="w' + ro + '"><span class="ph" style="width:' + (30 + (p.length * 7) % 45) + '%"></span><span class="ic">' + icon + '</span></div>';
  }
  function fieldRow(f, key) {
    var p = typeof f === 'string' ? f : (f.p || f.path || '');
    var ff = typeof f === 'string' ? {} : f, m = fieldIndex[p];
    var bad = (findingsByField[key + '|' + p] || []).length || (model && !m && !assocIndex[p]);
    var label = loc(ff.label) || fieldLabel(p);
    return '<div class="fld' + (ff.wide ? ' wide' : '') + (bad ? ' bad' : '') + '" data-p="' + esc(p) + '" title="' + esc(p) + '">' +
      '<div class="lb">' + esc(label) + (m && m.required ? '<span class="req">*</span>' : '') + (ff.showIf ? ' <span class="chip">showIf</span>' : '') + '</div>' +
      (assocIndex[p] ? '<div class="w ro">' + esc(T.rows) + ' ▸</div>' : widget(ff, p)) + '</div>';
  }
  var DRAW = {
    panel: function (b, key) { return '<div class="fields">' + (b.fields || []).map(function (f) { return fieldRow(f, key); }).join('') + '</div>'; },
    hero: function (b) {
      var sub = [].concat(b.sub || []).map(fieldLabel).join(' · ');
      var ch = [].concat(b.chips || []).map(function (p) { return '<span>' + esc(fieldLabel(p)) + '</span>'; }).join('');
      var meter = b.meter ? '<div class="meter">' + esc(fieldLabel(b.meter)) + '<div class="bar"><i></i></div></div>' : '';
      var status = b.status ? '<span class="chip">' + esc(fieldLabel(b.status)) + '</span>' : '';
      return '<div class="hero"><div class="logo"></div><div style="flex:1;min-width:0"><div class="nm">' + esc(b.title ? fieldLabel(b.title) : '') + ' ' + status + chips(b) +
        '</div><div class="sb">' + esc(sub) + '</div><div class="chips">' + ch + '</div></div>' + meter + '</div>';
    },
    facts: function (b) {
      var items = [].concat(b.items || []).map(function (p) { return '<div><b>—</b><span>' + esc(fieldLabel(typeof p === 'string' ? p : p.p)) + '</span></div>'; });
      if (b.count) items.push('<div><b>#</b><span>' + esc(assocLabel(b.count)) + '</span></div>');
      return '<div class="facts">' + (items.join('') || '<span class="note">' + esc(T.empty) + '</span>') + '</div>';
    },
    grid: function (b) {
      var a = assocIndex[b.a] || {};
      var cols = (b.cardFields || b.fields || a.fields || []).map(function (p) { return typeof p === 'string' ? p : p.p; })
        .filter(function (p) { return p && p !== '/id' && !(a.fields && /^\/company$/.test(p)); }).slice(0, 6);
      if (!cols.length) cols = ['…'];
      var th = cols.map(function (p) { return '<th title="' + esc(p) + '">' + esc(last(p)) + '</th>'; }).join('');
      var tr = [1, 2].map(function () { return '<tr>' + cols.map(function (p, i) { return '<td><span class="ph" style="width:' + (40 + (i * 13) % 50) + '%"></span></td>'; }).join('') + '</tr>'; }).join('');
      return '<table class="grid"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>' +
        '<div class="refs" style="margin-top:4px">' + esc(b.a || '') + (a.table ? ' → ' + esc(a.table) : '') + '</div>';
    },
    validation: function () {
      return '<div class="vlist"><div><i style="background:var(--err)"></i><span class="ph" style="width:60%"></span></div>' +
        '<div><i style="background:var(--warn)"></i><span class="ph" style="width:45%"></span></div><div><i style="background:var(--on-secondary)"></i><span class="ph" style="width:52%"></span></div></div>';
    },
    note: function (b) { return '<p class="note" style="margin:0">' + esc(loc(b.text)) + '</p>'; }
  };
  function drawGeneric(b) {
    var r = refs(b);
    if (!r.length) return '<div class="vlist"><div><span class="ph" style="width:80%"></span></div><div><span class="ph" style="width:55%"></span></div></div>';
    return '<div class="refs">' + r.slice(0, 10).map(function (p) { return '<span title="' + esc(p) + '">' + esc(assocIndex[p] ? assocLabel(p) : fieldLabel(p)) + '</span>'; }).join('') + (r.length > 10 ? '…' : '') + '</div>';
  }

  // ---------------------------------------------------------------- side panel: what was clicked
  function renderSide() {
    var side = document.getElementById('side');
    var b = selected && blockByKey[selected.key];
    if (!b) { side.className = ''; side.innerHTML = ''; return; }
    var html = '';
    if (selected.field) {
      var p = selected.field, m = fieldIndex[p], a = assocIndex[p];
      var spec = (b.fields || []).filter(function (f) { return (typeof f === 'string' ? f : f.p) === p; })[0] || {};
      html += '<h2><span>' + esc(T.field) + ' · ' + esc(fieldLabel(p)) + '</span><button class="close">' + esc(T.close) + '</button></h2><div class="meta">' + esc(p) + '</div><dl>';
      if (a) { html += '<dt>' + esc(T.table) + '</dt><dd>' + esc(a.table || '') + '</dd><dt>' + esc(T.fieldsOf) + '</dt><dd>' + esc((a.fields || []).join(', ')) + '</dd>'; }
      else if (m) {
        html += '<dt>' + esc(T.type) + '</dt><dd>' + esc(m.type || '') + '</dd>';
        if (m.group) html += '<dt>' + esc(T.group) + '</dt><dd>' + esc(fieldLabel(m.group)) + '</dd>';
        html += '<dt>' + esc(T.required) + '</dt><dd>' + (m.required ? T.yes : T.no) + '</dd>';
        var vals = m.values || m.enumeration;
        if (vals) html += '<dt>' + esc(T.values) + '</dt><dd>' + esc([].concat(vals).map(function (v) { return typeof v === 'object' ? (v.value || v.label || JSON.stringify(v)) : v; }).slice(0, 12).join(', ')) + '</dd>';
        var tgt = m.fk || m.foreignKey || m.target;
        if (tgt) html += '<dt>' + esc(T.target) + '</dt><dd>' + esc(typeof tgt === 'object' ? (tgt.table || JSON.stringify(tgt)) : tgt) + '</dd>';
      } else if (model) html += '<dt>' + esc(T.type) + '</dt><dd class="where">' + esc(T.unknown) + '</dd>';
      if (spec.w) html += '<dt>' + esc(T.widget) + '</dt><dd>' + esc(spec.w) + '</dd>';
      if (spec.ro) html += '<dt>' + esc(T.readOnly) + '</dt><dd>' + T.yes + '</dd>';
      html += '</dl>';
      (findingsByField[selected.key + '|' + p] || []).forEach(function (f) { html += '<p><span class="sev ' + (f.e ? 'sev-e' : 'sev-w') + '">' + (f.e ? 'ERR' : 'WARN') + '</span>' + esc(f.text) + '</p>'; });
      html += '<pre>' + esc(JSON.stringify(spec, null, 2)) + '</pre>';
    } else {
      html += '<h2><span>' + esc(T.block) + ' · ' + esc(loc(b.title) || b.type) + '</span><button class="close">' + esc(T.close) + '</button></h2>';
      html += '<div class="meta">' + esc(b.type || '') + (b.id ? ' · id ' + esc(b.id) : '') + '</div>';
      (findingsByBlock[selected.key] || []).forEach(function (f) { html += '<p><span class="sev ' + (f.e ? 'sev-e' : 'sev-w') + '">' + (f.e ? 'ERR' : 'WARN') + '</span>' + esc(f.text) + '</p>'; });
      var r = refs(b);
      if (r.length) html += '<dl><dt>' + esc(T.refs) + '</dt><dd>' + r.map(function (p) { return esc((assocIndex[p] ? assocLabel(p) : fieldLabel(p)) + ' (' + p + ')'); }).join('<br>') + '</dd></dl>';
      html += '<div class="meta">' + esc(T.json) + '</div><pre>' + esc(JSON.stringify(b, null, 2)) + '</pre>';
    }
    side.innerHTML = html; side.className = 'on';
    side.querySelector('.close').onclick = function () {
      selected = null; renderSide();
      Array.prototype.forEach.call(document.querySelectorAll('#form .sel'), function (s) { s.classList.remove('sel'); });
    };
  }
})();
</script>
</body>
